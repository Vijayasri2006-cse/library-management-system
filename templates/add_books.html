<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f8f9fa;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #6c5ce7;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        select {
            background: #f9f9f9;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6c5ce7;
            color:white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }

        button:hover {
            background:#4e43c5
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Add Books</h2>
        <form action="/add_book" method="POST">
            <input type="text" name="book_id" placeholder="Enter Book ID" required>
            <input type="text" name="title" placeholder="Enter Title" required>
            <input type="text" name="authors" placeholder="Enter Authors" required>

            <select name="genre" required>
                <option value="" disabled selected>Select Genre</option>
                <option value="Fiction">Fiction</option>
                <option value="Non-Fiction">Non-Fiction</option>
                <option value="Science">Science</option>
                <option value="Technology">Technology</option>
                <option value="Engineering">Engineering</option>
                <option value="Mathematics">Mathematics</option>
            </select>

            <input type="number" name="total_copies" placeholder="Total Copies" required>
            <input type="text" name="shelf_number" placeholder="Shelf Number" required>
            <input type="text" name="publisher"  placeholder="Publisher" required>

            <select name="branch" required>
                <option value="" disabled selected>Select Branch</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="Civil">Civil</option>
                <option value="EEE">EEE</option>
                <option value="Mech">Mech</option>
                <option value="Common For All">Common For All</option>
            </select>

            <select name="year" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <button type="submit" class="submit-btn">Add Book</button>
        </form>
    </div>

</body>
</html>
