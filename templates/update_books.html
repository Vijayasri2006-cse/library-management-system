<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #6c5ce7;
            font-size: 24px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            color: #000;
            background: #fff;
        }
        input::placeholder, select {
            color: #777;
        }
        input[readonly] {
            background: #f5f5f5;
            color: #555;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #6c5ce7;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #4e43c5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Update Books</h2>
        <form id="updateBookForm">
            <div class="form-group">
                <input type="text" id="book_id" name="book_id" placeholder="Book ID" readonly>
            </div>
            <div class="form-group">
                <input type="text" id="title" name="title" placeholder="Book Title" required>
            </div>
            <div class="form-group">
                <input type="text" id="authors" name="authors" placeholder="Authors" required>
            </div>
            <div class="form-group">
                <input type="text" id="genre" name="genre" placeholder="Genre" required>
            </div>
            <div class="form-group">
                <input type="number" id="total_copies" name="total_copies" placeholder="Total Copies" required>
            </div>
            <div class="form-group">
                <input type="text" id="shelf_number" name="shelf_number" placeholder="Shelf Number" required>
            </div>
            <div class="form-group">
                <input type="text" id="publisher" name="publisher" placeholder="Publisher" required>
            </div>
            <div class="form-group">
                <select id="branch" name="branch">
                    <option value="" disabled selected>Branch</option>
                    <option value="CSE">CSE</option>
                    <option value="ECE">ECE</option>
                    <option value="EEE">EEE</option>
                    <option value="Civil">Civil</option>
                    <option value="Mech">Mech</option>
                </select>
            </div>
            <div class="form-group">
                <select id="year" name="year">
                    <option value="" disabled selected>Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>
            <button type="submit" class="btn">Update Book</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get("id");

            // Fetch book details and pre-fill form
            fetch(`/get_book/${bookId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("book_id").value = data.book_id;
                    document.getElementById("title").value = data.title;
                    document.getElementById("authors").value = data.authors;
                    document.getElementById("genre").value = data.genre;
                    document.getElementById("total_copies").value = data.total_copies;
                    document.getElementById("shelf_number").value = data.shelf_number;
                    document.getElementById("publisher").value = data.publisher;
                    document.getElementById("branch").value = data.branch;
                    document.getElementById("year").value = data.year;
                });

            // Handle form submission
            document.getElementById("updateBookForm").addEventListener("submit", function (event) {
                event.preventDefault();
                
                const formData = new FormData(this);
                fetch(`/update_book/${bookId}`, {
                    method: "POST",
                    body: new URLSearchParams(formData)
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    if (data.success) {
                        window.location.href = "/admin_dashboard";
                    }
                });
            });
        });
    </script>
</body>
</html>
