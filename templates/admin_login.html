<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
}

/* Header */
.header{
    background-color: #f9f7a1;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
}

/* Login White Box */
.container {
    width: 500px;
    background: white;
    padding: 50px;
    border-radius: 12px;
    box-shadow: 0px 0px 15px rgba(0,0,0,0.1);

    margin: 40px auto 0 auto;
}

/* Form Alignment */
form {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Input Fields */
input {
    width: 90%;
    padding: 12px;
    margin-bottom: 20px;

    border: 1px solid #ccc;
    border-radius: 5px;

    font-size: 16px;
    outline: none;
}

/* Input Focus */
input:focus {
    border-color: #4CAF50;
}

/* Login Button */
button {
    width: 90%;
    padding: 12px;

    background-color: #4CAF50;
    color: white;

    border: none;
    border-radius: 5px;

    font-size: 18px;
    cursor: pointer;

    transition: 0.3s;
}

/* Button Hover */
button:hover {
    background-color: #45a049;
}
</style>
</head>
<body>
    <div class="header">Admin Login</div>
    <div class="container">
        
    <form
        action="{{url_for('admin_login')}}" method="POST">
            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
