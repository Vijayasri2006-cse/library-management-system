<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issued Books | Library Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 40px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: auto;
            height: 90vh;
            overflow-y: auto;
        }

        h2 {
            text-align: center;
            color: #6c5ce7;
            font-size: 2em;
            margin-bottom: 30px;
        }

        h3 {
            text-decoration: underline;
            color: #000000; /* Optional: To match the color with the main heading */
            margin-bottom: 20px;
        }

        .form-container, .table-container {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }

        button:hover {
            background: linear-gradient(to right, #0056b3, #003d80);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
            font-size: 1.2em;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Issued Books</h2>

        <!-- Form to Issue a Book -->
        <div class="form-container">
            <h3>Issue a Book</h3><br>
            <form id="issueBookForm">
                <div class="form-group">
                    <label for="bookId">Book ID</label>
                    <input type="text" id="bookId" required>
                </div>
                <div class="form-group">
                    <label for="studentRollNo">Student Roll Number</label>
                    <input type="text" id="studentRollNo" required>
                </div>
                <div class="form-group">
                    <label for="dueDate">Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>
                <button type="submit">Issue Book</button>
            </form>
        </div>

        <!-- Table for Displaying Issued Books -->
        <div class="table-container">
            <h3>Issued Books List</h3>
            <table id="issuedBooksTable">
                <thead>
                    <tr>
                        <th>Issue ID</th>
                        <th>Book ID</th>
                        <th>Student Roll No</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                
                        <tr>
                            <td>1</td>
                            <td>1</td>
                            <td>19</td>
                            <td>2025-04-01</td>
                            <td>2025-04-15</td>
                            <td>Issued</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>9</td>
                            <td>35</td>
                            <td>2025-04-03</td>
                            <td>2025-04-17</td>
                            <td>Issued</td>
                        </tr>
                        <tr>
                            <td>3</td>
                            <td>10</td>
                            <td>059</td>
                            <td>2025-04-05</td>
                            <td>2025-04-19</td>
                            <td>Returned</td>
                        </tr>
                        <tr>
                            <td>4</td>
                            <td>11</td>
                            <td>001</td>
                            <td>2025-04-07</td>
                            <td>2025-04-21</td>
                            <td>Overdue</td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>8</td>
                            <td>020</td>
                            <td>2025-04-10</td>
                            <td>2025-04-24</td>
                            <td>Issued</td>
                        </tr>
                    
                    
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Function to load all issued books from the backend (assuming API is available)
        function loadIssuedBooks() {

    fetch('/api/issued_books')
    .then(response => response.json())
    .then(data => {

        const tableBody =
        document.querySelector("#issuedBooksTable tbody");

        tableBody.innerHTML = "";

        data.forEach(book => {

            const row = `
                <tr>
                    <td>${book.issue_id}</td>
                    <td>${book.book_id}</td>
                    <td>${book.roll_number}</td>
                    <td>${book.issue_date}</td>
                    <td>${book.due_date}</td>
                    <td>${book.status}</td>
                </tr>
            `;

            tableBody.innerHTML += row;

        });

    })

    .catch(error => {
        console.log(error);
    });

}

        // Handle the form submission to issue a book
        document.getElementById("issueBookForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const bookId = document.getElementById("bookId").value;
            const studentRollNo = document.getElementById("studentRollNo").value;
            const dueDate = document.getElementById("dueDate").value;

            // Post the issue request to the backend API
            fetch('/api/issue_book', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
    book_id: bookId,
    roll_number: studentRollNo,
    due_date: dueDate
})
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);  // Show success message
                loadIssuedBooks();  // Reload the issued books list
                document.getElementById("issueBookForm").reset();  // Reset the form
            })
            .catch(error => console.error("Error issuing book:", error));
        });

        // Load the issued books data when the page is loaded
        window.onload = loadIssuedBooks;
    </script>

</body>
</html>
