<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f0f0f0;
        }
        .header {
            background-color: #f9f7a1;
            padding: 15px;
            font-size: 40px;
            font-weight: bold;
        }
        .container {
            margin-top: 50px;
        }
        .library-image {
            width: 600px;
            height: auto;
            margin-top: 20px;
        }
        .buttons {
            margin-top: 30px;
            text-align: center; /* Ensures buttons are centered */
        }
        .buttons button {
            margin: 10px;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            width: 200px; /* Ensures all buttons have the same width */
            display: inline-block; /* Aligns the buttons next to each other */
        }
        .buttons button:hover {
            background-color: #45a049;
        }
        .help-support {
            margin-top: 30px;
            font-size: 18px;
            color: #007bff;
            cursor: pointer;
            display: inline-block;
        }
        .help-support:hover {
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .close {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-top: 10px;
        }
        .close:hover {
            color: red;
        }
    </style>
</head>
<body>
    <div class="header">Library Management System</div>

    <!-- Library Image -->
    <img src="{{url_for('static',filename='images/library.jpg')}}" alt="Library Image" class="library-image">

    <div class="container">
        <div class="buttons">
            <a href="{{ url_for('register') }}"><button>Register</button></a>
            <a href="{{ url_for('admin_login') }}"><button>Admin Login</button></a>
            <a href="{{ url_for('user_login') }}"><button>User Login</button></a>
        </div>
        <p class="help-support" onclick="openHelpModal()">Help & Support</p>
    </div>

    <!-- Help & Support Modal -->
    <div class="modal" id="helpModal">
        <div class="modal-content">
            <h2>Help & Support</h2>
            <p>If you need assistance, contact:</p>
            <p><strong>Email:</strong> support@library.com</p>
            <p><strong>Phone:</strong> +1-800-123-4567</p>
            <span class="close" onclick="closeHelpModal()">Close</span>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        function openHelpModal() {
            document.getElementById("helpModal").style.display = "flex";
        }

        function closeHelpModal() {
            document.getElementById("helpModal").style.display = "none";
        }

        window.onclick = function(event) {
            let modal = document.getElementById("helpModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
